include theme.conf

background_opacity 1.0

remember_window_size  no
initial_window_width  900
initial_window_height 550

# Tab bar (style only; colors live in theme.conf)
tab_bar_style powerline
tab_powerline_style slanted
active_tab_font_style   bold
inactive_tab_font_style normal

# Send /effort to focused window (scoped per-pane = per Claude session)
map alt+e send_text all /effort\r

# --- Splits (side-by-side panes) ---
enabled_layouts splits:split_axis=horizontal,stack

# vertical split  -> new pane to the RIGHT (side by side)
map ctrl+alt+v launch --location=vsplit --cwd=current
# horizontal split -> new pane BELOW
map ctrl+alt+h launch --location=hsplit --cwd=current
# new pane (auto-placed by layout)
map ctrl+alt+enter launch --cwd=current

# move focus between panes
map ctrl+shift+left  neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up    neighboring_window up
map ctrl+shift+down  neighboring_window down

# rotate / resize / close
map ctrl+shift+f move_window forward
map alt+shift+r start_resizing_window
# equalize ALL panes to EQUAL fractions (handles the original/first window too)
# resize_window reset only sets biases to 0.5 -> unequal for nested trees.
map ctrl+alt+r kitten equalize.py
# focus/zoom the active pane FULLSCREEN (hide all others); toggle to restore splits
map ctrl+alt+f toggle_layout stack
map ctrl+shift+q close_window

# --- Font size step (override default ±2.0 -> smaller ±0.5) ---
map ctrl+shift+equal      change_font_size all +0.5
map ctrl+shift+plus       change_font_size all +0.5
map ctrl+shift+kp_add     change_font_size all +0.5
map ctrl+shift+minus      change_font_size all -0.5
map ctrl+shift+kp_subtract change_font_size all -0.5
map ctrl+shift+backspace  change_font_size all 0
